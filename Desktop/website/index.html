<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google 翻譯</title>
  <!-- 引入 PeerJS 支援跨裝置點對點即時同步 -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <!-- 引入 Google Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Google Sans', Roboto, 'Noto Sans TC', Arial, sans-serif;
    }

    body {
      background-color: #ffffff;
      color: #3c4043;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽列 */
    header {
      height: 64px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e0e0e0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 50%;
      color: #5f6368;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background-color: #f1f3f4;
    }

    .logo {
      font-size: 22px;
      display: flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }

    .logo span.g-blue { color: #4285F4; font-weight: 500; }
    .logo span.g-red { color: #EA4335; font-weight: 500; }
    .logo span.g-yellow { color: #FBBC05; font-weight: 500; }
    .logo span.g-green { color: #34A853; font-weight: 500; }
    .logo span.translate-text {
      color: #5f6368;
      font-weight: 400;
      margin-left: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: #00796b;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      border: 2px solid #e8f0fe;
      cursor: pointer;
    }

    /* 主內容區 */
    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 48px;
      flex: 1;
    }

    /* 頂部功能膠囊按鈕 */
    .mode-pills {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid #dadce0;
      background-color: #fff;
      color: #1967d2;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .pill.active {
      background-color: #e8f0fe;
      border-color: transparent;
    }

    .pill .material-symbols-outlined {
      font-size: 18px;
    }

    /* 語言選擇列 */
    .lang-bar {
      display: grid;
      grid-template-columns: 1fr 48px 1fr;
      align-items: center;
      margin-bottom: 8px;
    }

    .lang-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .lang-tab {
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 500;
      color: #5f6368;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      position: relative;
    }

    .lang-tab.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
    }

    .lang-tab:hover:not(.active) {
      background-color: #f8f9fa;
      color: #202124;
    }

    /* 左右雙欄翻譯框 */
    .translator-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .box {
      height: 220px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 12px 20px;
      position: relative;
    }

    .source-box {
      border: 1px solid #dadce0;
      background-color: #ffffff;
    }

    .source-box:focus-within {
      border-color: #1a73e8;
      box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3);
    }

    .target-box {
      background-color: #f1f3f4;
      border: 1px solid transparent;
    }

    textarea {
      width: 100%;
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-size: 24px;
      line-height: 1.4;
      color: #202124;
    }

    .target-box textarea::placeholder {
      color: #5f6368;
    }

    .box-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .feedback-note {
      text-align: right;
      font-size: 12px;
      color: #5f6368;
      font-style: italic;
      margin-top: 8px;
      cursor: pointer;
    }

    /* 底部圓形按鈕 */
    .bottom-actions {
      display: flex;
      justify-content: center;
      gap: 48px;
      margin-top: 72px;
    }

    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #5f6368;
      font-size: 14px;
      cursor: pointer;
    }

    .circle-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid #dadce0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5f6368;
      background: #fff;
    }

    .circle-btn:hover {
      background-color: #f8f9fa;
    }

    /* 隱藏式連線設定面板（點擊右上角齒輪開啟） */
    #connModal {
      display: none;
      position: fixed;
      top: 70px;
      right: 20px;
      width: 340px;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      padding: 16px;
      z-index: 100;
    }

    #connModal h4 {
      margin-bottom: 8px;
      color: #202124;
    }

    .conn-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .conn-row input {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #dadce0;
      border-radius: 6px;
      font-size: 14px;
    }

    .conn-row button {
      padding: 6px 12px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }

    .status-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      color: #188038;
      background: #e6f4ea;
      padding: 4px 8px;
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      main { padding: 16px; }
      .translator-grid { grid-template-columns: 1fr; }
      .lang-bar { grid-template-columns: 1fr 40px 1fr; }
    }
  </style>
</head>
<body>

  <!-- 頂部列 -->
  <header>
    <div class="header-left">
      <button class="icon-btn" title="主選單">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="logo">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
        <span class="translate-text">翻譯</span>
      </div>
    </div>

    <div class="header-right">
      <button class="icon-btn" title="外觀">
        <span class="material-symbols-outlined">light_mode</span>
      </button>
      <!-- 點擊設定齒輪可打開跨裝置房間連線面板 -->
      <button class="icon-btn" id="settingsBtn" title="設定 / 連線配對">
        <span class="material-symbols-outlined">settings</span>
      </button>
      <button class="icon-btn" title="Google 應用程式">
        <span class="material-symbols-outlined">apps</span>
      </button>
      <div class="avatar">使用者</div>
    </div>
  </header>

  <!-- 跨裝置連線設定浮動面板 -->
  <div id="connModal">
    <h4>即時同步連線設定</h4>
    <p style="font-size: 12px; color: #5f6368;">
      同電腦開兩個分頁會<strong>自動同步</strong>。<br>
      若要跨手機/不同電腦同步，請在下方配對：
    </p>
    <div style="margin-top: 10px; font-size: 13px;">
      你的連線代碼：<strong id="myPeerId" style="color:#1a73e8; user-select:all;">產生中...</strong>
    </div>
    <div class="conn-row">
      <input type="text" id="remotePeerInput" placeholder="輸入對方的連線代碼">
      <button id="connectBtn">連線</button>
    </div>
    <div id="connStatus" class="status-badge">同機跨分頁同步已就緒</div>
  </div>

  <main>
    <!-- 頂部功能切換膠囊 -->
    <div class="mode-pills">
      <button class="pill active">
        <span class="material-symbols-outlined">translate</span> 文字
      </button>
      <button class="pill">
        <span class="material-symbols-outlined">image</span> 圖片
      </button>
      <button class="pill">
        <span class="material-symbols-outlined">description</span> 文件
      </button>
      <button class="pill">
        <span class="material-symbols-outlined">language</span> 網站
      </button>
    </div>

    <!-- 語言列 -->
    <div class="lang-bar">
      <div class="lang-tabs">
        <div class="lang-tab">偵測語言</div>
        <div class="lang-tab active">英文</div>
        <div class="lang-tab">契維文</div>
        <div class="lang-tab">中文 (繁體)</div>
        <button class="icon-btn"><span class="material-symbols-outlined">expand_more</span></button>
      </div>

      <div style="display:flex; justify-content:center;">
        <button class="icon-btn" id="swapBtn" title="對調語言">
          <span class="material-symbols-outlined">swap_horiz</span>
        </button>
      </div>

      <div class="lang-tabs">
        <div class="lang-tab active">中文 (繁體)</div>
        <div class="lang-tab">英文</div>
        <div class="lang-tab">中文 (簡體)</div>
        <button class="icon-btn"><span class="material-symbols-outlined">expand_more</span></button>
      </div>
    </div>

    <!-- 雙欄輸入與翻譯結果框 -->
    <div class="translator-grid">
      <!-- 左側：使用者輸入框 -->
      <div class="box source-box">
        <textarea id="sourceText" placeholder="" autofocus></textarea>
        <div class="box-footer">
          <button class="icon-btn" title="語音輸入">
            <span class="material-symbols-outlined">mic</span>
          </button>
          <div style="display:flex; align-items:center; gap:4px; color:#5f6368;">
            <span class="material-symbols-outlined" style="font-size:18px; cursor:pointer;">arrow_drop_down</span>
            <span class="material-symbols-outlined" style="font-size:20px; cursor:pointer;">keyboard</span>
          </div>
        </div>
      </div>

      <!-- 右側：外部人員也可直接輸入的「翻譯」框 -->
      <div class="box target-box">
        <textarea id="targetText" placeholder="翻譯"></textarea>
        <div class="box-footer">
          <div></div>
          <button class="icon-btn" id="copyBtn" title="複製翻譯">
            <span class="material-symbols-outlined" style="font-size:20px;">content_copy</span>
          </button>
        </div>
      </div>
    </div>

    <div class="feedback-note">提供意見</div>

    <!-- 底部圓形按鈕 -->
    <div class="bottom-actions">
      <div class="action-item">
        <div class="circle-btn">
          <span class="material-symbols-outlined" style="font-size:28px;">history</span>
        </div>
        <span>翻譯記錄</span>
      </div>
      <div class="action-item">
        <div class="circle-btn">
          <span class="material-symbols-outlined" style="font-size:28px;">star</span>
        </div>
        <span>已儲存</span>
      </div>
    </div>
  </main>

  <script>
    const sourceText = document.getElementById('sourceText');
    const targetText = document.getElementById('targetText');
    const settingsBtn = document.getElementById('settingsBtn');
    const connModal = document.getElementById('connModal');
    const myPeerIdEl = document.getElementById('myPeerId');
    const remotePeerInput = document.getElementById('remotePeerInput');
    const connectBtn = document.getElementById('connectBtn');
    const connStatus = document.getElementById('connStatus');

    // 切換右上角隱藏設定面板
    settingsBtn.addEventListener('click', () => {
      connModal.style.display = connModal.style.display === 'block' ? 'none' : 'block';
    });

    // ==========================================
    // 1. 同電腦跨分頁即時同步 (BroadcastChannel)
    // ==========================================
    const bc = new BroadcastChannel('translate_sync_channel');

    bc.onmessage = (event) => {
      const { type, text } = event.data;
      if (type === 'source') {
        sourceText.value = text;
      } else if (type === 'target') {
        targetText.value = text;
      }
    };

    // ==========================================
    // 2. 跨裝置點對點即時同步 (PeerJS WebRTC)
    // ==========================================
    const shortId = 'gt-' + Math.random().toString(36).substring(2, 7);
    const peer = new Peer(shortId);
    let activeConn = null;

    peer.on('open', (id) => {
      myPeerIdEl.textContent = id;
    });

    peer.on('connection', (conn) => {
      setupConnection(conn);
    });

    connectBtn.addEventListener('click', () => {
      const remoteId = remotePeerInput.value.trim();
      if (!remoteId) return;
      const conn = peer.connect(remoteId);
      setupConnection(conn);
    });

    function setupConnection(conn) {
      activeConn = conn;
      conn.on('open', () => {
        connStatus.textContent = '已與遠端裝置連線 (' + conn.peer + ')';
        // 連線成功時先同步目前畫面文字
        conn.send({ type: 'source', text: sourceText.value });
        conn.send({ type: 'target', text: targetText.value });
      });

      conn.on('data', (data) => {
        if (data.type === 'source') {
          sourceText.value = data.text;
        } else if (data.type === 'target') {
          targetText.value = data.text;
        }
      });

      conn.on('close', () => {
        connStatus.textContent = '遠端連線已中斷';
      });
    }

    // ==========================================
    // 3. 監聽左右框輸入並廣播給外部
    // ==========================================
    sourceText.addEventListener('input', () => {
      const payload = { type: 'source', text: sourceText.value };
      bc.postMessage(payload);
      if (activeConn && activeConn.open) {
        activeConn.send(payload);
      }
    });

    targetText.addEventListener('input', () => {
      const payload = { type: 'target', text: targetText.value };
      bc.postMessage(payload);
      if (activeConn && activeConn.open) {
        activeConn.send(payload);
      }
    });

    // 左右對調按鈕
    document.getElementById('swapBtn').addEventListener('click', () => {
      const temp = sourceText.value;
      sourceText.value = targetText.value;
      targetText.value = temp;
      sourceText.dispatchEvent(new Event('input'));
      targetText.dispatchEvent(new Event('input'));
    });

    // 複製按鈕
    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(targetText.value);
    });
  </script>
</body>
</html>
